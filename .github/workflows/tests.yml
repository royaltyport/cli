name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    environment: Staging
    concurrency:
      group: staging-integration
      cancel-in-progress: false
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration
        env:
          ROYALTYPORT_TEST_ENVIRONMENT: staging
          ROYALTYPORT_TEST_API_KEY: ${{ secrets.ROYALTYPORT_TEST_API_KEY }}
          ROYALTYPORT_TEST_PROJECT_ID: ${{ vars.ROYALTYPORT_TEST_PROJECT_ID }}
          ROYALTYPORT_TEST_BASE_URL: ${{ vars.ROYALTYPORT_TEST_BASE_URL }}
          ROYALTYPORT_TEST_PROTECTION_BYPASS: ${{ secrets.ROYALTYPORT_TEST_PROTECTION_BYPASS }}

name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    environment: Staging
    concurrency:
      group: staging-integration
      cancel-in-progress: false
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration
        env:
          ROYALTYPORT_TEST_ENVIRONMENT: staging
          ROYALTYPORT_TEST_API_KEY: ${{ secrets.ROYALTYPORT_TEST_API_KEY }}
          ROYALTYPORT_TEST_PROJECT_ID: ${{ vars.ROYALTYPORT_TEST_PROJECT_ID }}
          ROYALTYPORT_TEST_BASE_URL: ${{ vars.ROYALTYPORT_TEST_BASE_URL }}
          ROYALTYPORT_TEST_PROTECTION_BYPASS: ${{ secrets.ROYALTYPORT_TEST_PROTECTION_BYPASS }}

  package-artifacts:
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Pack and smoke-test the published files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts .package-smoke
          npm pack --ignore-scripts --pack-destination release-artifacts
          tar -xzf release-artifacts/royaltyport-cli-*.tgz -C .package-smoke
          test "$(node .package-smoke/package/bin/royaltyport.js --version)" = "$(node -p 'require("./package.json").version')"
          node .package-smoke/package/bin/royaltyport.js --help
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
